# The fast checks for each pull request to main. The e2e tests stay local (see CLAUDE.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request stops its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # These checks do not start the app, so they do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
